<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart Quest - Delivery Tracking</title>

  <!-- Leaflet CSS + JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Leaflet Routing Machine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 16px;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      color: #333;
      min-height: 100vh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h2 { color: #2a2a7a; margin: 8px 0 4px; }
    .sub { color: #777; margin: 0 0 6px; font-size: 14px; }
    #timer { font-weight: bold; color: darkred; font-variant-numeric: tabular-nums; }
    #map {
      height: 460px;
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
      background: #dfe6ec;
      display: grid;
      place-items: center;
      color: #667;
    }
    .car-icon { font-size: 30px; line-height: 1; text-align: center; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
    .pin-icon { font-size: 26px; line-height: 1; text-align: center; }

    .cards {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
      margin: 24px 0 18px; text-align: left;
    }
    .card {
      background: #fff; border-radius: 15px; padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    .card h3 { margin: 0 0 14px; font-size: 18px; color: #2a2a7a; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 15px; }
    .row.total { border-top: 1px solid #eee; margin-top: 8px; padding-top: 12px; font-weight: 700; }
    .muted { color: #888; font-size: 13px; }
    .score { font-size: 42px; font-weight: 800; color: #d2691e; line-height: 1; margin: 4px 0 12px; }

    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; padding-bottom: 30px; }
    .btn {
      display: inline-block; padding: 14px 32px; border-radius: 25px; font-weight: 600;
      text-decoration: none; border: none; cursor: pointer; font-size: 16px;
      background: linear-gradient(135deg, #d2691e, #b8621a); color: #fff;
      box-shadow: 0 4px 15px rgba(210, 105, 30, 0.3); transition: transform .2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn.alt { background: #fff; color: #666; border: 1px solid #dee2e6; box-shadow: none; }

    @media (max-width: 760px) { .cards { grid-template-columns: 1fr; } #map { height: 340px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h2 id="headline">🚚 Your order will arrive in <span id="timer">2:00</span></h2>
    <p class="sub" id="subline">Demo delivery, sped up so you don't have to wait 14 minutes.</p>
    <div id="map"></div>

    <div class="cards">
      <section class="card" aria-labelledby="orderTitle">
        <h3 id="orderTitle">Your order</h3>
        <div id="orderBody"></div>
      </section>
      <section class="card" aria-labelledby="questTitle">
        <h3 id="questTitle">Quest report</h3>
        <div id="questBody"></div>
      </section>
    </div>

    <div class="actions">
      <button class="btn" id="playAgain" type="button">Play again</button>
      <a class="btn alt" href="home.html">Back to home</a>
    </div>
  </div>

  <script src="../data/store.js"></script>
  <script src="../data/ingredients.js"></script>
  <script src="../js/cartquest.js"></script>
  <script>
    const order = CQ.get().order;
    if (!order) {
      window.location.replace('home.html');      // nothing was ordered
    } else {
      /* ---------- order receipt + quest report ---------- */
      document.getElementById('orderBody').innerHTML =
        `<div class="muted" style="margin-bottom:8px">Order ${CQ.esc(order.id)} for ${CQ.esc(order.name)}</div>` +
        order.items.map(i => `<div class="row"><span>${i.emoji} ${CQ.esc(i.name)} × ${i.qty}</span><span>${CQ.money(i.price * i.qty)}</span></div>`).join('') +
        `<div class="row"><span>Delivery</span><span>${CQ.money(order.delivery)}</span></div>` +
        `<div class="row total"><span>Total paid</span><span>${CQ.money(order.total)}</span></div>` +
        `<div class="muted" style="margin-top:12px">📍 ${CQ.esc(order.address)}<br>💳 ${CQ.esc(order.method)}${order.last4 ? ' ending ' + CQ.esc(order.last4) : ''}</div>`;

      const q = order.quest;
      document.getElementById('questBody').innerHTML = q
        ? `<div class="muted">${q.emoji} ${CQ.esc(q.dish)} (${CQ.esc(q.cuisine)})</div>
           <div class="score">${q.points} pts</div>
           <div class="row"><span>Ingredients collected</span><span>${q.found} / ${q.needed}</span></div>
           <div class="row"><span>Extras in cart</span><span>${q.extraUnits}</span></div>
           <div class="row"><span>Shopping time</span><span>${CQ.fmtTime(q.elapsed)}</span></div>
           <p class="muted" style="margin-top:12px">${q.complete
              ? 'Quest complete! You collected everything for ' + CQ.esc(q.dish) + '.'
              : 'You checked out before finding everything. Try again and grab them all!'}</p>`
        : '<p class="muted">No dish was chosen for this order.</p>';

      document.getElementById('playAgain').addEventListener('click', () => {
        CQ.clearQuest();
        window.location.href = 'prompt.html';
      });

      /* ---------- map + countdown ---------- */
      const DEMO_SECONDS = 2 * 60;
      const store = { lat: 49.25284, lng: -122.89639 };
      const home  = { lat: 49.277748, lng: -122.909050 };
      const mapEl = document.getElementById('map');

      let carMarker = null, driving = false;

      function drive(coords) {
        if (driving || !carMarker) return;
        driving = true;
        const stepMs = (DEMO_SECONDS * 1000) / coords.length;
        let i = 0;
        (function move() {
          carMarker.setLatLng([coords[i].lat, coords[i].lng]);
          if (i < coords.length - 1) { i++; setTimeout(move, stepMs); }
        })();
      }

      if (typeof L === 'undefined') {
        // Offline: the map libraries didn't load, but the timer still works.
        mapEl.textContent = '🗺️ The live map needs an internet connection, but your order is on its way.';
      } else {
        const map = L.map('map').setView([(store.lat + home.lat) / 2, (store.lng + home.lng) / 2], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const emoji = (e, cls, size) => L.divIcon({ html: e, className: cls, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
        L.marker([store.lat, store.lng], { icon: emoji('🏪', 'pin-icon', 30) }).addTo(map);
        L.marker([home.lat, home.lng],  { icon: emoji('🏠', 'pin-icon', 30) }).addTo(map);
        carMarker = L.marker([store.lat, store.lng], { icon: emoji('🚚', 'car-icon', 36) }).addTo(map);

        // Straight-line fallback if the free routing server is busy or unreachable
        function straightLine() {
          const pts = [];
          for (let k = 0; k <= 80; k++) {
            pts.push({ lat: store.lat + (home.lat - store.lat) * k / 80, lng: store.lng + (home.lng - store.lng) * k / 80 });
          }
          L.polyline(pts.map(p => [p.lat, p.lng]), { color: 'blue', opacity: 0.7, weight: 5 }).addTo(map);
          drive(pts);
        }

        if (L.Routing) {
          const control = L.Routing.control({
            waypoints: [L.latLng(store.lat, store.lng), L.latLng(home.lat, home.lng)],
            lineOptions: { styles: [{ color: 'blue', opacity: 0.7, weight: 5 }] },
            createMarker: function () { return null; },   // hide default pins
            show: false                                   // hide the turn-by-turn list
          }).addTo(map);
          control.on('routesfound', e => drive(e.routes[0].coordinates));
          control.on('routingerror', straightLine);
          setTimeout(() => { if (!driving) straightLine(); }, 6000);
        } else {
          straightLine();
        }
      }

      // Countdown
      let timeLeft = DEMO_SECONDS;
      const timerEl = document.getElementById('timer');
      const paint = () => { timerEl.textContent = CQ.fmtTime(timeLeft); };
      paint();
      const countdown = setInterval(() => {
        timeLeft--;
        paint();
        if (timeLeft <= 0) {
          clearInterval(countdown);
          document.getElementById('headline').textContent = '🎉 Your order has arrived!';
          document.getElementById('subline').textContent = 'Enjoy your ' + (order.quest ? order.quest.dish : 'groceries') + '.';
        }
      }, 1000);
    }
  </script>
</body>
</html>
