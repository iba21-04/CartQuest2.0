<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quest - Shopping Cart</title>

<style>
    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #333;
            min-height: 100vh;
        }


        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-icon {
            position: relative;
            width: 32px;
            height: 26px;
        }

        .cart-body {
            width: 22px;
            height: 16px;
            border: 2.5px solid #d2691e;
            border-radius: 3px;
            position: absolute;
            top: 4px;
            left: 8px;
            background: white;
        }

        .cart-handle {
            width: 10px;
            height: 10px;
            border: 2.5px solid #d2691e;
            border-bottom: none;
            border-right: none;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 4px 0 0 0;
        }

        .cart-wheels {
            position: absolute;
            bottom: 0;
            left: 6px;
        }

        .wheel {
            width: 5px;
            height: 5px;
            background: #d2691e;
            border-radius: 50%;
            position: absolute;
            bottom: -2px;
        }

        .left-wheel { left: 2px; }
        .right-wheel { left: 14px; }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        .nav-link {
            text-decoration: none;
            color: #666;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link:hover {
            color: #d2691e;
            transform: translateY(-1px);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: #d2691e;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .stories-btn {
            background: linear-gradient(135deg, #d2691e, #b8621a);
            color: white;
            box-shadow: 0 4px 15px rgba(210, 105, 30, 0.3);
        }

        .stories-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(210, 105, 30, 0.4);
        }

        .settings-btn {
            background: #f8f9fa;
            color: #666;
            border: 1px solid #dee2e6;
        }

        .settings-btn:hover {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        /* Main Content */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
        }

        .cart-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .cart-title {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .large-cart-icon {
            width: 120px;
            height: 90px;
            position: relative;
            margin-bottom: 20px;
        }

        .large-cart-body {
            width: 80px;
            height: 60px;
            border: 4px solid #d2691e;
            border-radius: 8px;
            position: absolute;
            top: 15px;
            left: 20px;
            background: linear-gradient(135deg, #fff5ee, #ffeee6);
        }

        .large-cart-handle {
            width: 25px;
            height: 25px;
            border: 4px solid #d2691e;
            border-bottom: none;
            border-right: none;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 8px 0 0 0;
        }

        .large-cart-wheels {
            position: absolute;
            bottom: 0;
            left: 15px;
        }

        .large-wheel {
            width: 12px;
            height: 12px;
            background: #d2691e;
            border-radius: 50%;
            position: absolute;
            bottom: -6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .large-wheel.left { left: 8px; }
        .large-wheel.right { left: 50px; }

        .empty-cart {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-cart h3 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #333;
        }

        .empty-cart p {
            font-size: 16px;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        .shop-now-btn {
            background: linear-gradient(135deg, #d2691e, #b8621a);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(210, 105, 30, 0.3);
        }

        .shop-now-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(210, 105, 30, 0.4);
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .delivery-info, .order-summary {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .delivery-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .store-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .delivery-details h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 5px;
        }

        .delivery-details p {
            color: #666;
            font-size: 14px;
        }

        .item-list-section h4 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .item-list-btn {
            background: linear-gradient(135deg, #d2691e, #b8621a);
            color: white;
            box-shadow: 0 4px 15px rgba(210, 105, 30, 0.3);
        }

        .add-items-btn {
            background: #f8f9fa;
            color: #666;
            border: 2px dashed #dee2e6;
        }

        .item-list-btn:hover, .add-items-btn:hover {
            transform: translateY(-2px);
        }

        .item-list-btn:hover {
            box-shadow: 0 6px 20px rgba(210, 105, 30, 0.4);
        }

        .add-items-btn:hover {
            background: #e9ecef;
            border-color: #d2691e;
            color: #d2691e;
        }

        .order-summary h4 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        .subtotal {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
        }

        .subtotal-amount {
            background: linear-gradient(135deg, #d2691e, #b8621a);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cart-section, .delivery-info, .order-summary {
            animation: fadeInUp 0.6s ease;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                gap: 20px;
            }

            .container {
                grid-template-columns: 1fr;
                gap: 20px;
                margin: 20px auto;
                padding: 0 15px;
            }

            .cart-section, .delivery-info, .order-summary {
                padding: 20px;
            }

            .cart-title {
                font-size: 24px;
            }

            .large-cart-icon {
                width: 100px;
                height: 75px;
            }
        }


        /* ---- Cart contents (added) ---- */
        .cart-item {
            display: grid;
            grid-template-columns: 56px 1fr auto auto 30px;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }
        .cart-item:last-child { border-bottom: none; }
        .item-emoji {
            width: 56px; height: 56px; border-radius: 12px;
            display: grid; place-items: center; font-size: 30px;
            background: linear-gradient(135deg, #fff5ee, #ffeee6);
        }
        .item-name { font-weight: 600; font-size: 16px; }
        .item-meta { color: #888; font-size: 13px; margin-top: 3px; }
        .tag-extra {
            display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 10px;
            background: #fff0e0; color: #b8621a; font-size: 11px; font-weight: 700;
        }
        .qty-stepper { display: flex; align-items: center; gap: 8px; }
        .qty-stepper button {
            width: 30px; height: 30px; border-radius: 50%; border: 1px solid #dee2e6;
            background: #f8f9fa; font-size: 16px; cursor: pointer; transition: all 0.2s ease;
        }
        .qty-stepper button:hover { background: #d2691e; border-color: #d2691e; color: #fff; }
        .qty-stepper b { min-width: 20px; text-align: center; }
        .line-total { font-weight: 700; min-width: 64px; text-align: right; }
        .remove-btn { border: none; background: none; color: #aaa; font-size: 18px; cursor: pointer; }
        .remove-btn:hover { color: #c0392b; }

        .quest-status {
            margin-bottom: 20px; padding: 16px 18px; border-radius: 12px;
            font-size: 15px; line-height: 1.5;
        }
        .quest-status.ok { background: #e8f5e8; border: 1px solid #c3e6cb; color: #155724; }
        .quest-status.warn { background: #fff4e5; border: 1px solid #ffd9a8; color: #8a4b08; }
        .quest-status a { color: inherit; font-weight: 700; }

        .sum-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; color: #555; }
        .sum-row.total { margin-top: 16px; padding-top: 16px; border-top: 1px solid #eee; color: #333; }
        .action-btn { display: block; text-align: center; text-decoration: none; }
        .action-btn.disabled { opacity: 0.45; pointer-events: none; }
        .clear-link {
            display: block; margin: 6px auto 0; background: none; border: none;
            color: #999; text-decoration: underline; cursor: pointer; font-size: 13px;
        }
        .clear-link:hover { color: #c0392b; }
        .shop-now-btn { text-decoration: none; display: inline-block; }

        @media (max-width: 768px) {
            .cart-item { grid-template-columns: 48px 1fr auto; }
            .cart-item .line-total, .cart-item .remove-btn { grid-column: auto; }
            .item-emoji { width: 48px; height: 48px; }
        }
</style>
        
</head>
<body>
    <nav class="navbar">
        <a class="logo" href="pages/home.html" style="text-decoration:none">
            <div class="cart-icon">
                <div class="cart-body"></div>
                <div class="cart-handle"></div>
                <div class="cart-wheels"><div class="wheel left-wheel"></div><div class="wheel right-wheel"></div></div>
            </div>
            <span class="logo-text">Cart Quest</span>
        </a>
        <ul class="nav-links">
            <li><a class="nav-link" href="pages/home.html">Home</a></li>
            <li><a class="nav-link" href="pages/game.html">Keep shopping</a></li>
            <li><a class="nav-link" href="pages/about.html">About</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="cart-section">
            <h2 class="cart-title">🛒 Your Shopping Cart</h2>
            <div id="cart-content"></div>
        </div>

        <div class="sidebar">
            <div class="delivery-info">
                <div class="delivery-header">
                    <div class="store-icon">CQ</div>
                    <div class="delivery-details">
                        <h3>Cart Quest Market</h3>
                        <p>Deliver to <span id="deliver-to">you</span> 📍</p>
                    </div>
                </div>
            </div>

            <div class="order-summary">
                <h4>📝 Order summary</h4>
                <div class="sum-row"><span id="sum-items-label">Items</span><span id="sum-subtotal">$0.00</span></div>
                <div class="sum-row"><span>Delivery</span><span id="sum-delivery">$0.00</span></div>
                <div class="sum-row total">
                    <div class="subtotal" style="width:100%">
                        <span>Total</span>
                        <span class="subtotal-amount" id="sum-total">$0.00</span>
                    </div>
                </div>

                <div style="margin-top: 22px;">
                    <a class="action-btn item-list-btn" id="checkout-btn" href="CreditCard.html">Check out</a>
                    <a class="action-btn add-items-btn" href="pages/game.html">➕ Add items</a>
                    <button class="clear-link" id="clear-btn" type="button">Empty cart</button>
                </div>
            </div>
        </div>
    </div>

    <script src="data/store.js"></script>
    <script src="data/ingredients.js"></script>
    <script src="js/cartquest.js"></script>
    <script>
        const STORE = CQ.STORE;
        const content = document.getElementById('cart-content');

        function emptyState(s) {
            const target = CQ.getDish(s) ? 'pages/game.html' : 'pages/prompt.html';
            return `
                <div class="empty-cart">
                    <div class="large-cart-icon">
                        <div class="large-cart-body"></div>
                        <div class="large-cart-handle"></div>
                        <div class="large-cart-wheels">
                            <div class="large-wheel left"></div>
                            <div class="large-wheel right"></div>
                        </div>
                    </div>
                    <h3>Your cart is empty</h3>
                    <p>Add some delicious items to get started with your order!</p>
                    <a class="shop-now-btn" href="${target}">🍽️ Start Shopping</a>
                </div>`;
        }

        // Are we missing anything for the chosen dish?
        function questStatus(s) {
            const dish = CQ.getDish(s);
            if (!dish) return '';
            const needs = CQ.needs(s);
            const missing = needs.filter(n => !n.done);
            if (!missing.length) {
                const p = CQ.progress(s);
                return `<div class="quest-status ok">✅ You have everything for <b>${CQ.esc(dish.name)}</b>. Quest score so far: <b>${p.points}</b>.</div>`;
            }
            return `<div class="quest-status warn">🛒 Still missing for <b>${CQ.esc(dish.name)}</b>: ` +
                   `${missing.map(n => CQ.esc(n.label)).join(', ')}. <a href="pages/game.html">Go find ${missing.length === 1 ? 'it' : 'them'}</a></div>`;
        }

        function render() {
            const s = CQ.get();
            const ids = Object.keys(s.cart);
            const units = CQ.units(s);

            if (!ids.length) {
                content.innerHTML = emptyState(s);
            } else {
                content.innerHTML = questStatus(s) + ids.map(id => {
                    const it = STORE.items[id], q = s.cart[id];
                    const extra = CQ.getDish(s) && !CQ.isNeeded(id, s) ? '<span class="tag-extra">extra</span>' : '';
                    return `
                    <div class="cart-item">
                        <div class="item-emoji">${it.emoji}</div>
                        <div>
                            <div class="item-name">${CQ.esc(it.name)}${extra}</div>
                            <div class="item-meta">Aisle ${it.aisle}: ${CQ.esc(STORE.aisles[it.aisle].name)} &middot; ${CQ.money(it.price)} each</div>
                        </div>
                        <div class="qty-stepper">
                            <button type="button" data-act="dec" data-item="${id}" aria-label="One less ${CQ.esc(it.name)}">&minus;</button>
                            <b>${q}</b>
                            <button type="button" data-act="inc" data-item="${id}" aria-label="One more ${CQ.esc(it.name)}">+</button>
                        </div>
                        <div class="line-total">${CQ.money(it.price * q)}</div>
                        <button class="remove-btn" type="button" data-act="rm" data-item="${id}" aria-label="Remove ${CQ.esc(it.name)}">&#10005;</button>
                    </div>`;
                }).join('');
            }

            document.getElementById('sum-items-label').textContent = `Items (${units})`;
            document.getElementById('sum-subtotal').textContent = CQ.money(CQ.subtotal(s));
            document.getElementById('sum-delivery').textContent = CQ.money(CQ.deliveryFee(s));
            document.getElementById('sum-total').textContent = CQ.money(CQ.total(s));
            document.getElementById('deliver-to').textContent = (s.profile && s.profile.name) || 'you';
            document.getElementById('checkout-btn').classList.toggle('disabled', !ids.length);
            document.getElementById('clear-btn').style.display = ids.length ? 'block' : 'none';
        }

        content.addEventListener('click', e => {
            const b = e.target.closest('button[data-act]');
            if (!b) return;
            const id = b.dataset.item, q = CQ.get().cart[id] || 0;
            if (b.dataset.act === 'inc') CQ.setQty(id, q + 1);
            else if (b.dataset.act === 'dec') CQ.setQty(id, q - 1);
            else CQ.removeItem(id);
            render();
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            if (confirm('Remove everything from your cart?')) { CQ.emptyCart(); render(); }
        });

        // Warn (but don't block) if the recipe isn't complete
        document.getElementById('checkout-btn').addEventListener('click', e => {
            const s = CQ.get();
            if (!CQ.units(s)) { e.preventDefault(); return; }
            const missing = CQ.needs(s).filter(n => !n.done);
            if (missing.length && !confirm(`You're still missing ${missing.map(n => n.label).join(', ')}. Check out anyway?`)) {
                e.preventDefault();
            }
        });

        window.addEventListener('pageshow', render);
        render();
    </script>
</body>
</html>
